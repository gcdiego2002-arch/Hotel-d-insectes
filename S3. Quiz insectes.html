<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La missió de la Lola: descobrim els insectes!</title>
<style>
:root{
  --taronja:#f28c28; --taronja-f:#d9661a; --groc:#ffc93c; --marro:#8a5a2b; --marro-f:#5e3b1a;
  --verd:#5aa845; --verd-f:#3e7f2f; --vermell:#e2533b; --crema:#fff8ec; --tinta:#4a2f17;
  --lila:#6b63b5; --ombra:0 8px 0 rgba(94,59,26,.18);
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font); color:var(--tinta); overflow-x:hidden;
  background:linear-gradient(180deg,#ffe7b8 0%,#ffd99a 45%,#f7c27a 100%);
  min-height:100vh; -webkit-tap-highlight-color:transparent; user-select:none;
}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
button:focus-visible{outline:5px solid var(--lila);outline-offset:4px}

/* ---------- escenari de fons ---------- */
#escena{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#escena svg.terra{position:absolute;bottom:0;left:0;width:100%;height:28vh;min-height:150px}
.fulla-cau{position:absolute;top:-60px;width:34px;height:34px;opacity:.55;animation:cau linear infinite}
@keyframes cau{
  0%{transform:translate(0,-5vh) rotate(0)}
  50%{transform:translate(6vw,50vh) rotate(200deg)}
  100%{transform:translate(-3vw,110vh) rotate(420deg)}
}

/* ---------- capçalera ---------- */
header{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:clamp(8px,1.4vw,16px) clamp(12px,2.5vw,32px);gap:10px}
.marca{font-weight:900;font-size:clamp(16px,1.8vw,24px);color:var(--marro-f);display:flex;align-items:center;gap:8px}
.marca .punt{width:14px;height:14px;border-radius:50%;background:var(--vermell);box-shadow:0 0 0 4px #fff6}
.eines{display:flex;gap:10px}
.eina{background:#fffaf0cc;border:3px solid #e7c58f;border-radius:999px;padding:8px 16px;font-weight:800;
  font-size:clamp(14px,1.3vw,18px);color:var(--marro-f);display:flex;align-items:center;gap:6px;transition:transform .15s}
.eina:active{transform:scale(.95)}
.eina[hidden]{display:none}

/* ---------- contenidor ---------- */
#app{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:0 clamp(12px,2.5vw,32px) 28vh;min-height:calc(100vh - 70px)}
.pantalla{animation:entra .5s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes entra{from{opacity:0;transform:translateX(60px) scale(.98)}to{opacity:1;transform:none}}

/* ---------- Lola ---------- */
.lola{width:100%;height:auto;overflow:visible;animation:sura 3s ease-in-out infinite}
@keyframes sura{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.lola .ala{transform-box:fill-box;animation:aleteja .18s ease-in-out infinite alternate}
.lola .ala.e{transform-origin:100% 100%}
.lola .ala.d{transform-origin:0% 100%}
@keyframes aleteja{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.lola .boca,.lola .cella{display:none}
.lola.hola .b-hola,.lola.contenta .b-contenta,.lola.pensa .b-pensa,.lola.anima .b-anima{display:inline}
.lola.contenta .c-contenta,.lola.pensa .c-pensa,.lola.anima .c-anima{display:inline}
.lola .nines{transition:transform .4s}
.lola.pensa .nines{transform:translate(4px,-6px)}
.lola.anima .nines{transform:translate(0,3px)}
.lola .brac-d{transform-box:fill-box;transform-origin:10% 90%}
.lola.hola .brac-d{animation:saluda .6s ease-in-out infinite alternate}
@keyframes saluda{from{transform:rotate(-25deg)}to{transform:rotate(20deg)}}
.lola.contenta{animation:salta .7s cubic-bezier(.3,1.6,.5,1) 2, sura 3s 1.4s ease-in-out infinite}
@keyframes salta{0%,100%{transform:translateY(0) rotate(0)}40%{transform:translateY(-34px) rotate(-6deg)}70%{transform:translateY(0) rotate(4deg)}}
.lola.anima{animation:assenteix 1.2s ease-in-out 2, sura 3s 2.4s ease-in-out infinite}
@keyframes assenteix{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(5deg)}}
.lola .pensament{display:none}
.lola.pensa .pensament{display:inline;animation:batega 1.4s ease-in-out infinite}
@keyframes batega{50%{opacity:.4}}

/* bombolla de diàleg */
.bombolla{position:relative;background:#fff;border:4px solid #f0d2a2;border-radius:28px;padding:clamp(14px,1.8vw,24px) clamp(16px,2.2vw,30px);
  font-size:clamp(19px,2.1vw,30px);font-weight:700;line-height:1.35;box-shadow:var(--ombra)}
.bombolla .nom{display:block;font-size:.7em;color:var(--lila);font-weight:900;letter-spacing:.04em;margin-bottom:4px;text-transform:uppercase}
.bombolla.fletxa-e::before{content:"";position:absolute;left:-22px;top:42%;border:14px solid transparent;border-right:20px solid #f0d2a2}
.bombolla.fletxa-e::after{content:"";position:absolute;left:-14px;top:calc(42% + 4px);border:10px solid transparent;border-right:16px solid #fff}
.bombolla.bo{border-color:#9fd38a;background:#f2fbea}
.bombolla.bo.fletxa-e::after{border-right-color:#f2fbea}
.bombolla.bo.fletxa-e::before{border-right-color:#9fd38a}
.bombolla.pista{border-color:#ffcf7a;background:#fff6e0}
.bombolla.pista.fletxa-e::after{border-right-color:#fff6e0}
.bombolla.pista.fletxa-e::before{border-right-color:#ffcf7a}
.bombolla .petit{display:block;font-size:.78em;font-weight:600;margin-top:6px}

/* ---------- botons grans ---------- */
.boto{display:inline-flex;align-items:center;justify-content:center;gap:12px;border-radius:999px;font-weight:900;
  font-size:clamp(22px,2.6vw,36px);padding:clamp(14px,1.6vw,22px) clamp(32px,4vw,64px);letter-spacing:.04em;
  background:var(--verd);color:#fff;box-shadow:0 8px 0 var(--verd-f),0 14px 24px rgba(0,0,0,.15);transition:transform .12s, box-shadow .12s, filter .2s;min-height:72px}
.boto:active{transform:translateY(6px);box-shadow:0 2px 0 var(--verd-f)}
.boto.taronja{background:var(--taronja);box-shadow:0 8px 0 var(--taronja-f),0 14px 24px rgba(0,0,0,.15)}
.boto.taronja:active{box-shadow:0 2px 0 var(--taronja-f)}
.boto.secundari{background:#fff;color:var(--marro-f);border:4px solid var(--taronja);box-shadow:0 6px 0 #e9b47d;font-size:clamp(18px,2vw,28px)}
.boto.secundari:active{box-shadow:0 1px 0 #e9b47d}
.boto:disabled{filter:grayscale(1) opacity(.45);transform:none;box-shadow:0 8px 0 #999;cursor:not-allowed}
.boto.batega{animation:crida 1.6s ease-in-out infinite}
@keyframes crida{50%{transform:scale(1.05)}}

/* ---------- benvinguda ---------- */
.benvinguda{display:grid;grid-template-columns:minmax(220px,38%) 1fr;align-items:center;gap:clamp(16px,3vw,48px);padding-top:clamp(8px,2vh,30px)}
.titol{font-size:clamp(34px,5vw,72px);font-weight:900;line-height:1.05;color:var(--marro-f);
  text-shadow:0 4px 0 #fff, 0 8px 0 rgba(242,140,40,.35);margin-bottom:clamp(16px,2.5vh,30px)}
.titol span{color:var(--taronja-f)}
.benvinguda .accions{margin-top:clamp(20px,3.5vh,40px);display:flex;flex-wrap:wrap;gap:18px;align-items:center}

/* ---------- qüestionari ---------- */
.progres{display:flex;align-items:center;gap:16px;margin:4px 0 clamp(10px,1.6vh,20px)}
.progres .text{font-weight:900;font-size:clamp(18px,1.9vw,26px);white-space:nowrap;color:var(--marro-f)}
.barra{flex:1;height:26px;background:#fff8;border:3px solid #e7c58f;border-radius:999px;overflow:hidden;position:relative}
.barra i{display:block;height:100%;background:repeating-linear-gradient(45deg,#7cc35f 0 18px,#6ab54e 18px 36px);border-radius:999px;transition:width .6s cubic-bezier(.3,1.3,.5,1)}
.barra.repas i{background:repeating-linear-gradient(45deg,#f6a54a 0 18px,#ee9434 18px 36px)}
.quiz{display:grid;grid-template-columns:minmax(170px,26%) 1fr;gap:clamp(14px,2.4vw,36px);align-items:start}
.quiz .costat{position:sticky;top:10px;display:flex;flex-direction:column;gap:14px}
.quiz .costat .lola-caixa{max-width:260px;width:100%;margin:0 auto}
.targeta-q{background:var(--crema);border:5px solid #f0d2a2;border-radius:36px;padding:clamp(16px,2.4vw,34px);box-shadow:var(--ombra)}
.etiqueta{display:inline-block;padding:6px 16px;border-radius:999px;color:#fff;font-weight:900;font-size:clamp(14px,1.35vw,19px);letter-spacing:.05em;text-transform:uppercase;margin-bottom:12px}
.e-tria{background:var(--taronja)} .e-relaciona{background:var(--verd)} .e-identifica{background:var(--vermell)} .e-situacio{background:var(--lila)} .e-error{background:#c2185b} .e-repas{background:var(--marro)}
.pregunta-cap{display:flex;gap:clamp(12px,2vw,26px);align-items:center;margin-bottom:clamp(14px,2.4vh,26px)}
.pregunta-cap .img-insecte{flex:0 0 clamp(100px,13vw,170px);background:#fff;border-radius:28px;border:4px dashed #f0d2a2;padding:10px}
.pregunta{font-size:clamp(26px,3.1vw,44px);font-weight:900;line-height:1.2}
.opcions{display:grid;gap:clamp(10px,1.6vh,18px)}
.opcions.amb-icones{grid-template-columns:repeat(3,1fr)}
.opcio{position:relative;display:flex;align-items:center;gap:18px;text-align:left;background:#fff;border:5px solid #f0d2a2;border-radius:26px;
  padding:clamp(12px,1.6vw,20px) clamp(14px,1.8vw,24px);font-size:clamp(20px,2.2vw,31px);font-weight:800;line-height:1.25;
  box-shadow:0 6px 0 #ecc890;transition:transform .15s, box-shadow .15s, border-color .2s, background .2s, opacity .3s;min-height:84px}
.opcio:not(:disabled):hover{transform:translateY(-3px);border-color:var(--taronja)}
.opcio:not(:disabled):active{transform:translateY(4px);box-shadow:0 2px 0 #ecc890}
.opcio .lletra{flex:0 0 auto;width:clamp(44px,4vw,58px);height:clamp(44px,4vw,58px);border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900;font-size:.95em}
.opcio:nth-child(1) .lletra{background:#f28c28}.opcio:nth-child(2) .lletra{background:#5aa845}.opcio:nth-child(3) .lletra{background:#6b63b5}
.amb-icones .opcio{flex-direction:column;text-align:center;justify-content:flex-start;padding-top:18px}
.amb-icones .opcio .icona{width:72%;max-width:150px}
.amb-icones .opcio .lletra{position:absolute;top:10px;left:10px;width:40px;height:40px;font-size:20px}
.opcio:disabled{cursor:default}
.opcio.apagada{opacity:.45}
.opcio.encert{border-color:#58b947;background:#ecfae4;box-shadow:0 6px 0 #9fd38a;animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.opcio.error{border-color:#f2a541;background:#fff3e0;box-shadow:0 6px 0 #f5c98a;animation:sacseja .5s ease}
.opcio.correcta-mostrada{border-color:#58b947;background:#ecfae4;box-shadow:0 6px 0 #9fd38a;opacity:1}
.opcions:not(.amb-icones) .opcio{padding-right:76px}
.opcio .marca-res{position:absolute;right:14px;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:30px;font-weight:900}
.amb-icones .opcio .marca-res{top:12px;transform:none;right:10px;width:42px;height:42px;font-size:24px}
.opcio.encert .marca-res,.opcio.correcta-mostrada .marca-res{background:#58b947}
.opcio.error .marca-res{background:#f2a541}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes sacseja{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.peu-q{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:clamp(16px,2.6vh,28px);flex-wrap:wrap}
.peu-q .avis{font-weight:800;font-size:clamp(16px,1.6vw,22px);color:var(--marro)}
.segell{display:inline-flex;align-items:center;gap:8px;background:#58b947;color:#fff;font-weight:900;border-radius:999px;padding:6px 16px;font-size:.8em;margin-top:8px;animation:pop .5s}

/* ---------- final ---------- */
.final{display:grid;grid-template-columns:minmax(200px,30%) 1fr;gap:clamp(16px,3vw,44px);align-items:center}
.final .titol{font-size:clamp(32px,4.4vw,62px)}
.puntuacio{display:flex;align-items:center;gap:clamp(14px,2vw,30px);flex-wrap:wrap;background:#fff;border:5px solid #f0d2a2;border-radius:32px;padding:clamp(14px,2vw,26px) clamp(18px,2.6vw,36px);box-shadow:var(--ombra);margin:16px 0}
.puntuacio .num{font-size:clamp(54px,7vw,104px);font-weight:900;color:var(--verd-f);line-height:1}
.puntuacio .num small{font-size:.45em;color:var(--marro)}
.estrelles{display:flex;gap:8px}
.estrelles svg{width:clamp(44px,5vw,72px);height:auto}
.estrelles .on{animation:pop .6s both}
.estrelles .on:nth-child(2){animation-delay:.25s}.estrelles .on:nth-child(3){animation-delay:.5s}
.funcions{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,22px);margin:clamp(16px,2.4vh,28px) 0}
.funcio{background:#fff;border-radius:28px;padding:16px;text-align:center;border:5px solid;box-shadow:var(--ombra)}
.funcio svg{width:clamp(70px,8vw,120px);height:auto}
.funcio h3{font-size:clamp(18px,1.9vw,27px);font-weight:900;margin:6px 0}
.funcio p{font-size:clamp(15px,1.45vw,20px);font-weight:700;line-height:1.3}
.f-pol{border-color:#ffc93c}.f-pol h3{color:#c98a00}
.f-con{border-color:#e2533b}.f-con h3{color:#c43a22}
.f-des{border-color:#8a5a2b}.f-des h3{color:#6b4220}
.final .accions{display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.nota-docent{font-size:clamp(14px,1.3vw,18px);font-weight:700;color:var(--marro);margin-top:12px}

/* resum repàs */
.xifres{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.6vw,22px);margin:clamp(16px,2.4vh,28px) 0}
.xifra{background:#fff;border-radius:28px;padding:clamp(14px,2vw,24px);text-align:center;border:5px solid #f0d2a2;box-shadow:var(--ombra)}
.xifra b{display:block;font-size:clamp(48px,6vw,88px);line-height:1;font-weight:900}
.xifra span{font-size:clamp(16px,1.6vw,23px);font-weight:800}
.x1 b{color:var(--verd-f)}.x2 b{color:var(--taronja-f)}.x3 b{color:var(--lila)}

/* ---------- modal ---------- */
.fons-modal{position:fixed;inset:0;background:rgba(74,47,23,.45);z-index:50;display:grid;place-items:center;padding:20px;animation:fonsin .2s both}
@keyframes fonsin{from{opacity:0}}
.modal{background:var(--crema);border:5px solid #f0d2a2;border-radius:32px;max-width:900px;width:100%;max-height:88vh;overflow:auto;padding:clamp(18px,2.6vw,34px);box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .35s}
.modal h2{font-size:clamp(24px,2.6vw,36px);font-weight:900;margin-bottom:10px;color:var(--marro-f)}
.modal p{font-size:clamp(17px,1.7vw,23px);font-weight:700;line-height:1.35}
.modal .accions{display:flex;gap:14px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.modal .boto{font-size:clamp(18px,2vw,26px);min-height:60px;padding:12px 32px}
table.registre{width:100%;border-collapse:separate;border-spacing:0 6px;font-size:clamp(14px,1.35vw,18px);font-weight:700}
table.registre th{text-align:left;padding:6px 10px;color:var(--marro);font-size:.9em}
table.registre td{background:#fff;padding:8px 10px}
table.registre td:first-child{border-radius:14px 0 0 14px;font-weight:900}
table.registre td:last-child{border-radius:0 14px 14px 0}
.xip{display:inline-block;white-space:nowrap;border-radius:999px;padding:2px 10px;color:#fff;font-weight:900;font-size:.9em}
.xip.ok{background:#58b947}.xip.ko{background:#f2a541}.xip.cor{background:var(--lila)}.xip.no{background:#b9a58e}

/* ---------- confeti ---------- */
#confeti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.peca{position:absolute;width:20px;height:20px;animation:explota 1.4s cubic-bezier(.15,.7,.4,1) forwards}
.peca.fulla{border-radius:0 100% 0 100%}
.peca.rodona{border-radius:50%;width:14px;height:14px}
@keyframes explota{
  0%{transform:translate(0,0) rotate(0) scale(.4);opacity:1}
  70%{opacity:1}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(1);opacity:0}
}

/* ---------- responsive ---------- */
@media (max-width:820px){
  .benvinguda,.final{grid-template-columns:1fr;text-align:center}
  .benvinguda .lola-caixa,.final .lola-caixa{max-width:240px;margin:0 auto}
  .benvinguda .accions,.final .accions{justify-content:center}
  .bombolla.fletxa-e::before,.bombolla.fletxa-e::after{display:none}
  .quiz{grid-template-columns:1fr}
  .quiz .costat{position:static;flex-direction:row;align-items:center}
  .quiz .costat .lola-caixa{flex:0 0 110px}
  .funcions,.xifres{grid-template-columns:1fr}
  .puntuacio{justify-content:center}
}
@media (max-width:560px){
  .opcions.amb-icones{grid-template-columns:1fr}
  .amb-icones .opcio{flex-direction:row;text-align:left;padding-top:12px}
  .amb-icones .opcio .icona{width:80px}
  .amb-icones .opcio .lletra{position:static}
  .eina .txt{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .fulla-cau{display:none}
}
</style>
</head>
<body>

<div id="escena" aria-hidden="true"></div>

<header>
  <div class="marca"><span class="punt"></span>L'hotel d'insectes</div>
  <div class="eines">
    <button class="eina" id="btn-registre" title="Registre de respostes (docent)">📋 <span class="txt">Registre</span></button>
    <button class="eina" id="btn-reinici" title="Reiniciar l'activitat">↺ <span class="txt">Reiniciar</span></button>
  </div>
</header>

<main id="app"></main>
<div id="confeti" aria-hidden="true"></div>
<div id="modal-arrel"></div>

<script>
(function(){
"use strict";

/* =========================================================
   IL·LUSTRACIONS (SVG propis)
   ========================================================= */
function lolaSVG(estat){
  return `
<svg class="lola ${estat}" viewBox="0 0 220 230" role="img" aria-label="La Lola, una mosca simpàtica">
  <!-- pensament -->
  <g class="pensament" fill="#fff" stroke="#f0d2a2" stroke-width="3">
    <circle cx="186" cy="40" r="7"/><circle cx="200" cy="20" r="10"/>
  </g>
  <!-- ales -->
  <g opacity=".85">
    <ellipse class="ala e" cx="58" cy="118" rx="34" ry="52" transform="rotate(-38 58 118)" fill="#d9f1ff" stroke="#8ec7ea" stroke-width="4"/>
    <ellipse class="ala d" cx="162" cy="118" rx="34" ry="52" transform="rotate(38 162 118)" fill="#d9f1ff" stroke="#8ec7ea" stroke-width="4"/>
  </g>
  <!-- cames -->
  <g stroke="#3b3f78" stroke-width="7" stroke-linecap="round" fill="none">
    <path d="M86 196 q-8 14 -20 18"/><path d="M110 202 v18"/><path d="M134 196 q8 14 20 18"/>
  </g>
  <!-- cos -->
  <ellipse cx="110" cy="164" rx="50" ry="42" fill="#5b60a6"/>
  <ellipse cx="110" cy="172" rx="32" ry="26" fill="#8a8fd1"/>
  <path d="M84 160 q26 10 52 0" stroke="#4a4f92" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- braç esquerre -->
  <path d="M64 160 q-18 4 -24 -8" stroke="#3b3f78" stroke-width="8" fill="none" stroke-linecap="round"/>
  <circle cx="39" cy="150" r="8" fill="#3b3f78"/>
  <!-- braç dret (saluda) -->
  <g class="brac-d">
    <path d="M156 160 q18 -6 24 -24" stroke="#3b3f78" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="181" cy="134" r="8" fill="#3b3f78"/>
  </g>
  <!-- antenes -->
  <g stroke="#3b3f78" stroke-width="5" fill="none" stroke-linecap="round">

/* =========================================================
   ESTAT + PERSISTÈNCIA (col·lectiu, sense dades personals)
   ========================================================= */
const CLAU = "lola-insectes-v5";
function nouEstat(){ return {pantalla:"inici", i:0, ordre:{}, res:{}, repas:null}; }
function carrega(){
  try{ const t = localStorage.getItem(CLAU); if(!t) return null; const s = JSON.parse(t);
    if(s && s.pantalla && s.res) return s; }catch(e){}
  return null;
}
function desa(){ try{ localStorage.setItem(CLAU, JSON.stringify(S)); }catch(e){} }
function esborra(){ try{ localStorage.removeItem(CLAU); }catch(e){} }
let S = carrega() || nouEstat();

function barreja(n){
  const a=[...Array(n).keys()];
  for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}
  return a;
}
function comencar(){
  S = nouEstat();
  S.pantalla = "quiz";
  PREGUNTES.forEach(p=>{ S.ordre[p.id] = barreja(p.o.length); });
  PREGUNTES.forEach(p=>{ S.res[p.id] = {sel:null, ok:null, intents:0, repas:{sel:null, ok:null, intents:0}, corregida:false}; });
  desa(); render(true);
}
const punts = ()=> PREGUNTES.filter(p=>S.res[p.id] && S.res[p.id].ok===true).length;
const fallades = ()=> PREGUNTES.filter(p=>S.res[p.id] && S.res[p.id].ok===false);

/* =========================================================
   RENDER
   ========================================================= */
const app = document.getElementById("app");
let darreraClau = null;

function render(forca){
  const clau = S.pantalla + ":" + (S.pantalla==="quiz" ? S.i : S.pantalla==="repas" ? S.repas.j : "");
  const anima = forca || clau !== darreraClau;
  darreraClau = clau;
  let html = "";
  if(S.pantalla==="inici") html = vInici();
  else if(S.pantalla==="quiz") html = vPregunta(false);
  else if(S.pantalla==="final") html = vFinal();
  else if(S.pantalla==="repas") html = vPregunta(true);
  else if(S.pantalla==="resum") html = vResum();
  app.innerHTML = `<section class="pantalla${anima?"":" quiet"}">${html}</section>`;
  if(!anima) app.firstElementChild.style.animation="none";
  document.getElementById("btn-reinici").hidden = (S.pantalla==="inici");
  enllaca();
  if(anima) window.scrollTo({top:0,behavior:"smooth"});
}

function vInici(){
  return `
  <div class="benvinguda">
    <div class="lola-caixa">${lolaSVG("hola")}</div>
    <div>
      <h1 class="titol">La missió de la Lola:<br><span>descobrim els insectes!</span></h1>
      <div class="bombolla fletxa-e"><span class="nom">Lola</span>Hola, exploradors! Avui necessito la vostra ajuda per descobrir què fan els insectes al nostre hort. Esteu preparats?</div>
      <div class="accions"><button class="boto taronja batega" data-accio="comencar">COMENÇAR ➜</button></div>
    </div>
  </div>`;
}

function vPregunta(esRepas){
  let p, r, num, total, resp;
  if(esRepas){
    const id = S.repas.llista[S.repas.j];
    p = PREGUNTES.find(x=>x.id===id); r = S.res[id]; resp = r.repas;
    num = S.repas.j+1; total = S.repas.llista.length;
  } else {
    p = PREGUNTES[S.i]; r = S.res[p.id]; resp = r;
    num = S.i+1; total = PREGUNTES.length;
  }
  const ordre = S.ordre[p.id];
  const respost = resp.sel !== null;
  const encert = resp.ok === true;
  const ambIcones = !!p.ic;

  // Lola i bombolla
  let estat="pensa", bomb="", cls="";
  const idx = p.id;
  if(!respost){
    estat = "pensa";
    bomb = esRepas ? "Tornem-hi! Ara segur que ho trobeu."
      : p.tipus==="error" ? "Ups... ho he dit bé? Ajudeu-me, exploradors!"
      : MSG_PENSA[idx % MSG_PENSA.length];
  } else if(encert){
    estat = "contenta"; cls="bo";
    bomb = esRepas
      ? `Ara sí! Molt bé, exploradors!<span class="petit">${p.expl}</span><span class="segell">✓ Pregunta corregida</span>`
      : p.tipus==="error" ? `Uix, tenieu raó! M'havia equivocat. Gràcies, exploradors!<span class="petit">${p.expl}</span>`
      : `${MSG_BE[idx % MSG_BE.length]}<span class="petit">${p.expl}</span>`;
  } else {
    estat = "anima"; cls="pista";
    bomb = esRepas
      ? `No passa res, ara ho aprenem! La resposta correcta era: <b>«${p.o[0]}»</b><span class="petit">${p.expl}</span>`
      : `${MSG_ANIM[idx % MSG_ANIM.length]}<span class="petit">${p.pista}</span>`;
  }

  const opcions = ordre.map((orig,k)=>{
    let c = "opcio", marca = "";
    if(respost){
      if(orig===resp.sel){ c += resp.ok ? " encert" : " error"; marca = `<span class="marca-res">${resp.ok?"✓":"✗"}</span>`; }
      else if(esRepas && !resp.ok && orig===0){ c += " correcta-mostrada"; marca = `<span class="marca-res">✓</span>`; }
      else c += " apagada";
    }
    const icona = ambIcones ? ICONES[p.ic[orig]] : "";
    return `<button class="${c}" data-opcio="${orig}" ${respost?"disabled":""} aria-label="Opció ${LLETRES[k]}: ${p.o[orig]}">
      <span class="lletra">${LLETRES[k]}</span>${icona}<span>${p.o[orig]}</span>${marca}</button>`;
  }).join("");

  const darrera = num === total;
  const txtSeg = darrera ? (esRepas ? "ACABAR EL REPÀS ➜" : "ACABAR LA MISSIÓ ➜") : "SEGÜENT ➜";
  const pct = Math.round(((num-1) + (respost?1:0)) / total * 100);

  return `
  <div class="progres">
    <span class="text">${esRepas?"Repàs":"Pregunta"} ${num} de ${total}</span>
    <div class="barra${esRepas?" repas":""}" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div>
  </div>
  <div class="quiz">
    <div class="costat">
      <div class="lola-caixa">${lolaSVG(estat)}</div>
      <div class="bombolla ${cls}" aria-live="polite"><span class="nom">Lola</span>${bomb}</div>
    </div>
    <div class="targeta-q">
      <span class="etiqueta ${esRepas?"e-repas":"e-"+p.tipus}">${esRepas?"Repassem · ":""}${ETIQUETES[p.tipus]}</span>
      <div class="pregunta-cap">
        ${p.img?`<div class="img-insecte">${ICONES[p.img].replace('class="icona"','')}</div>`:""}
        <h2 class="pregunta">${p.q}</h2>
      </div>
      <div class="opcions${ambIcones?" amb-icones":""}">${opcions}</div>
      <div class="peu-q">
        ${respost?"":`<span class="avis">Trieu una resposta per continuar</span>`}
        <button class="boto${respost?" batega":""}" data-accio="seguent" ${respost?"":"disabled"}>${txtSeg}</button>
      </div>
    </div>
  </div>`;
}

function vFinal(){
  const n = punts(), t = PREGUNTES.length, f = fallades();
  const est = n>=Math.ceil(t*0.85)?3 : n>=Math.ceil(t*0.55)?2 : 1;
  let msg;
  if(n===t) msg = "Perfecte! Sou uns autèntics experts en insectes! L'hort està d'enhorabona!";
  else if(n>=Math.ceil(t*0.75)) msg = "Increïble! Sabeu moltíssimes coses sobre els insectes de l'hort!";
  else if(n>=Math.ceil(t*0.5)) msg = "Molt bona feina! Ja coneixeu molt bé què fan els insectes!";
  else msg = "Heu fet una gran exploració! Cada pregunta ens ha ensenyat alguna cosa nova. Seguim aprenent junts!";
  const pendents = f.filter(p=>!S.res[p.id].corregida).length;
  let botoRepas = "";
  if(f.length===0) botoRepas = `<p class="nota-docent">No hi ha cap pregunta per repassar. Tot encertat a la primera! 🎉</p>`;
  else if(S.repas && S.repas.acabat && pendents===0) botoRepas = `<button class="boto secundari" data-accio="veure-resum">VEURE EL RESUM DEL REPÀS</button>`;
  else botoRepas = `<button class="boto secundari" data-accio="repas">REPASSEM LES PREGUNTES?</button>`;

  return `
  <div class="final">
    <div class="lola-caixa">${lolaSVG("contenta")}</div>
    <div>
      <h1 class="titol">Missió completada!</h1>
      <div class="bombolla fletxa-e bo"><span class="nom">Lola</span>Moltes gràcies, exploradors! ${msg}</div>
      <div class="puntuacio">
        <div class="num">${n}<small> / ${t}</small></div>
        <div>
          <div class="estrelles">${ESTRELLA(est>=1)}${ESTRELLA(est>=2)}${ESTRELLA(est>=3)}</div>
          <div style="font-weight:800;font-size:clamp(16px,1.6vw,22px);margin-top:6px">respostes encertades a la primera</div>
        </div>
      </div>
    </div>
  </div>
  <div class="funcions">
    <div class="funcio f-pol">${ICONES.abella}<h3>Pol·linitzadors</h3><p>Abelles i papallones porten el pol·len de flor en flor. Així les plantes fan fruits i llavors.</p></div>
    <div class="funcio f-con">${ICONES.marieta}<h3>Controladors de plagues</h3><p>Les marietes es mengen els pugons que fan malbé les plantes.</p></div>
    <div class="funcio f-des">${ICONES.escarabat}<h3>Descomponedors</h3><p>Alguns escarabats i les seves larves transformen les restes de plantes perquè tornin a la terra.</p></div>
  </div>
  <div class="final accions" style="display:flex">
    ${botoRepas}
    <button class="boto taronja" data-accio="nova">TORNAR A JUGAR ↺</button>
  </div>`;
}

function vResum(){
  const f = fallades();
  const n = punts();
  const corr = f.filter(p=>S.res[p.id].corregida).length;
  const msg = corr===f.length
    ? "Les heu corregit totes! Ara sí que sou experts en insectes!"
    : "Molt bona feina repassant! Ara ja sabeu per què era cada resposta.";
  return `
  <div class="final">
    <div class="lola-caixa">${lolaSVG("contenta")}</div>
    <div>
      <h1 class="titol">Repàs acabat!</h1>
      <div class="bombolla fletxa-e bo"><span class="nom">Lola</span>${msg}</div>
    </div>
  </div>
  <div class="xifres">
    <div class="xifra x1"><b>${n}</b><span>preguntes encertades a la primera</span></div>
    <div class="xifra x2"><b>${f.length}</b><span>preguntes que hem repassat</span></div>
    <div class="xifra x3"><b>${corr}</b><span>preguntes corregides durant el repàs</span></div>
  </div>
  <p class="nota-docent" style="text-align:center">La puntuació de la missió continua sent ${n} de ${PREGUNTES.length}: el repàs no la canvia.</p>
  <div class="final accions" style="display:flex;justify-content:center;margin-top:18px">
    <button class="boto secundari" data-accio="a-final">TORNAR A LA PUNTUACIÓ</button>
    <button class="boto taronja" data-accio="nova">TORNAR A JUGAR ↺</button>
  </div>`;
}

/* =========================================================
   ACCIONS
   ========================================================= */
function enllaca(){
  app.querySelectorAll("[data-opcio]").forEach(b=>b.addEventListener("click",()=>tria(+b.dataset.opcio, b)));
  app.querySelectorAll("[data-accio]").forEach(b=>b.addEventListener("click",()=>accio(b.dataset.accio)));
}

function tria(orig, boto){
  const esRepas = S.pantalla==="repas";
  const p = esRepas ? PREGUNTES.find(x=>x.id===S.repas.llista[S.repas.j]) : PREGUNTES[S.i];
  const r = S.res[p.id];
  const resp = esRepas ? r.repas : r;
  if(resp.sel!==null) return;
  resp.sel = orig; resp.ok = (orig===0); resp.intents++;
  if(esRepas){ r.intents++; if(resp.ok) r.corregida = true; }
  desa();
  const rect = boto.getBoundingClientRect();
  render(false);
  if(resp.ok) confeti(rect.left+rect.width/2, rect.top+rect.height/2);
}

function accio(a){
  if(a==="comencar") comencar();
  else if(a==="seguent"){
    if(S.pantalla==="quiz"){
      if(S.res[PREGUNTES[S.i].id].sel===null) return;
      if(S.i < PREGUNTES.length-1){ S.i++; }
      else { S.pantalla="final"; setTimeout(()=>confeti(innerWidth/2, innerHeight/3, 60), 300); }
    } else if(S.pantalla==="repas"){
      const id = S.repas.llista[S.repas.j];
      if(S.res[id].repas.sel===null) return;
      if(S.repas.j < S.repas.llista.length-1){ S.repas.j++; }
      else { S.repas.acabat = true; S.pantalla="resum"; setTimeout(()=>confeti(innerWidth/2, innerHeight/3, 50), 300); }
    }
    desa(); render(true);
  }
  else if(a==="repas"){
    // només preguntes fallades a la primera i encara no corregides
    const llista = fallades().filter(p=>!S.res[p.id].corregida).map(p=>p.id);
    if(!llista.length){ S.pantalla="resum"; desa(); render(true); return; }
    llista.forEach(id=>{ S.res[id].repas.sel=null; S.res[id].repas.ok=null; });
    S.repas = {llista, j:0, acabat:false};
    S.pantalla = "repas"; desa(); render(true);
  }
  else if(a==="veure-resum"){ S.pantalla="resum"; desa(); render(true); }
  else if(a==="a-final"){ S.pantalla="final"; desa(); render(true); }
  else if(a==="nova") demanaReinici();
}

/* ---------- modals ---------- */
const arrelModal = document.getElementById("modal-arrel");
function obreModal(html){
  arrelModal.innerHTML = `<div class="fons-modal" role="dialog" aria-modal="true"><div class="modal">${html}</div></div>`;
  const fons = arrelModal.firstElementChild;
  fons.addEventListener("click",e=>{ if(e.target===fons) tancaModal(); });
  arrelModal.querySelectorAll("[data-tanca]").forEach(b=>b.addEventListener("click",tancaModal));
  return fons;
}
function tancaModal(){ arrelModal.innerHTML=""; }
document.addEventListener("keydown",e=>{ if(e.key==="Escape") tancaModal(); });

function demanaReinici(){
  const m = obreModal(`
    <h2>Començar una nova partida?</h2>
    <p>S'esborraran totes les respostes, els intents i el repàs d'aquesta partida.</p>
    <div class="accions">
      <button class="boto secundari" data-tanca>No, tornar</button>
      <button class="boto taronja" id="confirma-reinici">Sí, començar de nou</button>
    </div>`);
  m.querySelector("#confirma-reinici").addEventListener("click",()=>{
    tancaModal(); esborra(); S = nouEstat(); render(true);
  });
}

function mostraRegistre(){
  const iniciat = Object.keys(S.res).length>0;
  let cos;
  if(!iniciat){ cos = `<p>Encara no s'ha començat cap partida.</p>`; }
  else{
    const files = PREGUNTES.map((p,k)=>{
      const r = S.res[p.id];
      let primera = "—", estat = `<span class="xip no">sense respondre</span>`, rep = "—";
      if(r.sel!==null){
        primera = p.o[r.sel];
        estat = r.ok ? `<span class="xip ok">✓ correcta</span>` : `<span class="xip ko">✗ incorrecta</span>`;
      }
      if(r.ok===false){
        if(r.repas.sel===null) rep = `<span class="xip no">pendent</span>`;
        else rep = r.corregida ? `<span class="xip cor">corregida</span>` : `<span class="xip ko">no corregida</span>`;
      }
      return `<tr><td>${k+1}</td><td>${p.q}</td><td>${primera}</td><td>${estat}</td><td style="text-align:center">${r.intents}</td><td>${rep}</td></tr>`;
    }).join("");
    const respostes = PREGUNTES.filter(p=>S.res[p.id].sel!==null).length;
    const intents = PREGUNTES.reduce((s,p)=>s+S.res[p.id].intents,0);
    cos = `<p style="margin-bottom:10px">Registre col·lectiu de la classe · ${respostes} de ${PREGUNTES.length} respostes · ${punts()} encerts a la primera · ${intents} intents en total.</p>
      <table class="registre"><thead><tr><th>#</th><th>Pregunta</th><th>Primera resposta</th><th>Resultat</th><th>Intents</th><th>Repàs</th></tr></thead><tbody>${files}</tbody></table>`;
  }
  obreModal(`<h2>📋 Registre de respostes</h2>${cos}
    <div class="accions"><button class="boto" data-tanca>TANCAR</button></div>`);
}
document.getElementById("btn-registre").addEventListener("click",mostraRegistre);
document.getElementById("btn-reinici").addEventListener("click",demanaReinici);

/* ---------- confeti de fulles ---------- */
const COLORS = ["#f28c28","#ffc93c","#e2533b","#5aa845","#8a5a2b","#ff8fa3","#6b63b5"];
function confeti(x,y,n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const capa = document.getElementById("confeti");
  n = n || 26;
  for(let k=0;k<n;k++){
    const e = document.createElement("i");
    e.className = "peca " + (k%3===0?"rodona":"fulla");
    const ang = Math.random()*Math.PI*2, dist = 120+Math.random()*260;
    e.style.left = x+"px"; e.style.top = y+"px";
    e.style.background = COLORS[k%COLORS.length];
    e.style.setProperty("--dx", Math.cos(ang)*dist+"px");
    e.style.setProperty("--dy", (Math.sin(ang)*dist + 120)+"px");
    e.style.setProperty("--rot", (Math.random()*720-360)+"deg");
    e.style.animationDelay = (Math.random()*0.12)+"s";
    capa.appendChild(e);
    setTimeout(()=>e.remove(), 1700);
  }
}

/* ---------- escenari ---------- */
(function escena(){
  const el = document.getElementById("escena");
  const fulla = c=>`<svg viewBox="0 0 40 40"><path d="M4 36 C4 14 20 4 36 4 C36 22 24 36 4 36Z" fill="${c}"/><path d="M6 34 L32 8" stroke="#0003" stroke-width="2"/></svg>`;
  let h = "";
  const cols = ["#e2533b","#f28c28","#ffc93c","#a0522d","#d9661a","#7fae3e"];
  for(let k=0;k<9;k++){
    const left = (k*11 + 3) % 100, dur = 14 + (k*3)%11, del = -(k*2.3);
    h += `<div class="fulla-cau" style="left:${left}vw;animation-duration:${dur}s;animation-delay:${del}s">${fulla(cols[k%cols.length])}</div>`;
  }
  h += `<svg class="terra" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMax slice">
    <path d="M0 120 C200 70 400 140 600 100 C800 60 1000 120 1200 90 V260 H0Z" fill="#b8c96a" opacity=".7"/>
    <path d="M0 170 C250 130 450 190 700 150 C900 120 1050 170 1200 150 V260 H0Z" fill="#9db552"/>
    <!-- arbre de tardor -->
    <rect x="1060" y="40" width="26" height="130" rx="8" fill="#7a4a24"/>
    <circle cx="1073" cy="40" r="62" fill="#e2733b"/><circle cx="1030" cy="70" r="40" fill="#f2a03c"/><circle cx="1118" cy="72" r="42" fill="#d9661a"/>
    <!-- hotel d'insectes -->
    <g transform="translate(70 70)">
      <path d="M0 40 L50 6 L100 40Z" fill="#a0522d"/>
      <rect x="8" y="40" width="84" height="90" rx="6" fill="#c98b52" stroke="#7a4a24" stroke-width="5"/>
      <g fill="#7a4a24"><circle cx="30" cy="62" r="7"/><circle cx="50" cy="62" r="7"/><circle cx="70" cy="62" r="7"/></g>
      <rect x="18" y="80" width="64" height="16" fill="#e8c27a"/>
      <g stroke="#a0522d" stroke-width="3"><path d="M26 80v16M36 80v16M46 80v16M56 80v16M66 80v16"/></g>
      <rect x="18" y="104" width="64" height="18" fill="#8a5a2b"/>
    </g>
    <!-- bancals i flors -->
    <rect x="300" y="190" width="240" height="40" rx="10" fill="#8a5a2b"/>
    <rect x="640" y="200" width="260" height="40" rx="10" fill="#8a5a2b"/>
    <g>
      ${[330,390,450,510,670,740,810,870].map((x,k)=>`<path d="M${x} 195 V${160-(k%2)*12}" stroke="#3e7f2f" stroke-width="5"/><circle cx="${x}" cy="${156-(k%2)*12}" r="12" fill="${["#ff8fa3","#ffc93c","#e2533b","#fff"][k%4]}"/><circle cx="${x}" cy="${156-(k%2)*12}" r="5" fill="#f28c28"/>`).join("")}
    </g>
    <g fill="#d9661a" opacity=".8"><ellipse cx="250" cy="225" rx="14" ry="6" transform="rotate(-20 250 225)"/><ellipse cx="580" cy="240" rx="12" ry="5"/><ellipse cx="980" cy="230" rx="14" ry="6" transform="rotate(25 980 230)"/></g>
  </svg>`;
  el.innerHTML = h;
})();

/* Validació de l'estat recuperat (per si les preguntes canvien) */
(function valida(){
  if(S.pantalla!=="inici"){
    const ok = PREGUNTES.every(p=>S.res[p.id] && S.ordre[p.id] && S.ordre[p.id].length===p.o.length);
    if(!ok){ S = nouEstat(); esborra(); }
    if(S.pantalla==="repas" && (!S.repas || !S.repas.llista || !S.repas.llista.length)) S.pantalla="final";
  }
})();

render(true);
})();
</script>
